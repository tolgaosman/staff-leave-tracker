name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        run: npm ci
      # NEXT_PUBLIC_API_URL derleme anında gömülür: hem lib/api.ts'in istek attığı
      # adresi hem de app/layout.tsx'teki CSP'nin connect-src/frame-src/img-src
      # değerlerini belirler. Ayarlanmazsa localhost:8000'e düşer ve yayınlanan
      # site API'ye ulaşamaz (CSP de engeller). Depo ayarlarından tanımlayın:
      # Settings > Secrets and variables > Actions > Variables > NEXT_PUBLIC_API_URL
      - name: Build with Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      - name: Add .nojekyll file
        run: mkdir -p out && touch out/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
