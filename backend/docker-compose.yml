# Staff Leave Tracker API — yerel/production benzeri Docker kurulumu.
# Kullanım:
#   1) cp .env.production.example .env.production   (ve içini doldur; APP_KEY üret)
#   2) docker compose up --build
#   3) İlk sefer demo veri: docker compose exec app php artisan migrate:fresh --seed
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-leave_tracker}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dbdata:
